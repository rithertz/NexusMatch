
name: NexusMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend and database tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexusmatch
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: nexusmatch_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusmatch -d nexusmatch_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: ci_test_password
      NEXUSMATCH_TEST_DATABASE_URL: postgresql://nexusmatch:ci_test_password@localhost:5432/nexusmatch_ci_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Ruff
        run: python -m ruff check backend

      - name: Apply initial schema
        run: |
          psql -h localhost -p 5432 -U nexusmatch \
            -d nexusmatch_ci_test \
            -v ON_ERROR_STOP=1 \
            -f database/sql/schema/001_initial_schema.sql

      - name: Apply registration capacity migration
        run: |
          psql -h localhost -p 5432 -U nexusmatch \
            -d nexusmatch_ci_test \
            -v ON_ERROR_STOP=1 \
            -f database/sql/schema/002_registration_capacity.sql

      - name: Apply capacity update migration
        run: |
          psql -h localhost -p 5432 -U nexusmatch \
            -d nexusmatch_ci_test \
            -v ON_ERROR_STOP=1 \
            -f database/sql/schema/003_tournament_capacity_updates.sql

      - name: Run all backend and database tests
        run: python -m pytest backend/tests -v
