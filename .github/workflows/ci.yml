name: NexusMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexusmatch_ci_test
          POSTGRES_USER: nexusmatch
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusmatch -d nexusmatch_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nexusmatch_ci_test
      POSTGRES_USER: nexusmatch
      POSTGRES_PASSWORD: ci_test_password
      NEXUSMATCH_TEST_DATABASE_URL: postgresql://nexusmatch:ci_test_password@localhost:5432/nexusmatch_ci_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Ruff
        run: ruff check backend

      - name: Apply database migrations
        run: python backend/scripts/migrate.py

      - name: Run tests
        run: python -m pytest backend/tests -v