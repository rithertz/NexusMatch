name: NexusMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexusmatch_ci_test
          POSTGRES_USER: nexusmatch
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusmatch -d nexusmatch_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nexusmatch_ci_test
      POSTGRES_USER: nexusmatch
      POSTGRES_PASSWORD: ci_test_password
      NEXUSMATCH_TEST_DATABASE_URL: postgresql://nexusmatch:ci_test_password@localhost:5432/nexusmatch_ci_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check code with Ruff
        run: ruff check backend

      - name: Apply database migrations
        run: python backend/scripts/migrate.py

      - name: Run test suite
        run: python -m pytest backend/tests -v
